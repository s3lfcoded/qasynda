# Сборка под iPhone на Mac-сервере GitHub. Запускается только вручную (Actions → «Сборка iOS» → Run workflow):
# минуты macOS в приватном репозитории расходуются в 10 раз быстрее обычных.
# Сборка без подписи: проверяет, что приложение компилируется под iOS. На телефон такой файл не ставится —
# для установки нужна подпись своим Apple ID на Mac (см. scripts/build_ios.sh).
name: Сборка iOS
on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=QASYNDA_API=https://qasynda-api.onrender.com
      # .ipa — это zip с папкой Payload. Файл без подписи: её добавляет Sideloadly или Xcode при установке.
      - name: Упаковать в .ipa
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Qasynda-unsigned.ipa Payload
          ls -lh Qasynda-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Qasynda-unsigned-ipa
          path: app/Qasynda-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
